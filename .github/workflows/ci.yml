name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: distribook
          POSTGRES_PASSWORD: distribook
          POSTGRES_DB: distribook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distribook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DISTRIBOOK_TEST_DATABASE_URL: postgresql+asyncpg://distribook:distribook@127.0.0.1:5432/distribook_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Migrations apply cleanly and fully reverse
        env:
          DISTRIBOOK_DATABASE_URL: postgresql+asyncpg://distribook:distribook@127.0.0.1:5432/distribook
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Test (unit + integration against PostgreSQL)
        run: uv run pytest
