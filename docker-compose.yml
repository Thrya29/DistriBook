# Local development dependencies. The full multi-replica stack (API, nginx, Redis, k6,
# Prometheus) is added in a later phase.
name: distribook

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: distribook
      POSTGRES_PASSWORD: distribook  # local development only
      POSTGRES_DB: distribook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distribook -d distribook"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # Locks only: nothing worth persisting, so no snapshots or AOF.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"  # 6380 on the host avoids clashing with a locally installed Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
