[project]
name = "distribook"
version = "0.1.0"
description = "A concurrency-correct seat booking service with reproducible load tests and published latency percentiles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distribook"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "ASYNC",    # async pitfalls
  "S",        # bandit (security)
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]  # asserts and literal test keys are the point of a test

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]  # asyncpg ships no type information
ignore_missing_imports = true
